services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: scanly
      POSTGRES_PASSWORD: scanly
      POSTGRES_DB: scanly
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U scanly']
      interval: 5s
      retries: 10
volumes:
  pgdata:
